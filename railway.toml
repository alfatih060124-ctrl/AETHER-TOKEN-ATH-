[build]
builder = "RAILPACK"
buildCommand = "npm ci --no-audit --no-fund && npm run source:selfcheck && npm run syntax:check && npm run rpc:check:testnet && npm run readiness:testnet && npm run compile && npm test && npm run abi:export && npm run release:smoke:local"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 1
