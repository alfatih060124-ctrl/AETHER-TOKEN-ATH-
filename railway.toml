[build]
builder = "RAILPACK"
buildCommand = "npm install --no-audit --no-fund && npm run source:selfcheck && npm run rpc:check:testnet && npm run readiness:testnet && npm run compile && npm test"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 1
